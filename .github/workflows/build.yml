name: Android Build

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find APK (Debug)
        run: |
          echo "=== Ищем все APK файлы в проекте ==="
          find . -name "*.apk" -type f
          echo "=== Проверяем папку app ==="
          ls -la android/app/build/outputs/apk/debug/ || echo "Папка app не найдена"
          echo "=== Проверяем папку root build ==="
          ls -la android/build/outputs/apk/debug/ || echo "Папка root build не найдена"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ahem-Debug-APK
          # Ищем файл во всех возможных местах
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/build/outputs/apk/debug/*.apk
            **/*-debug.apk
          if-no-files-found: error
